events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        root /var/www/html/ca;

        index index.php;

        client_max_body_size 500M;

        # Inject AI agent widget into every HTML page (before </body>)
        sub_filter '</body>' '<script src="/ca-chat-widget.js"></script></body>';
        sub_filter_once on;

        # CA GraphQL/service API — must route through service/index.php (sets IS_SERVICE_REQUEST)
        location /service/ {
            try_files $uri $uri/ /service/index.php?$args;
        }

        # Main location block
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # PHP-FPM processing — matches service.php/Auth (PATH_INFO style) and plain .php
        location ~ [^/]\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }
    }
}
